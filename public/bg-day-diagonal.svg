<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Fondo día: mismo patrón que noche pero claro -->
  <rect width="100%" height="100%" fill="#F3F4F7" />

  <!-- Gradiente diagonal azul -> blanco suave -> rojo -->
  <defs>
    <linearGradient id="diagLinesNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#E9ECEF" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
  </defs>

  <g stroke="url(#diagLinesNight)" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="40"  y1="120"  x2="260"  y2="340"  stroke-width="6" />
    <line x1="320" y1="80"   x2="460"  y2="220"  stroke-width="3" />
    <line x1="620" y1="140"  x2="860"  y2="380"  stroke-width="5" />
    <line x1="880" y1="60"   x2="1040" y2="220"  stroke-width="2" />

    <line x1="60"  y1="520"  x2="280"  y2="740"  stroke-width="4" />
    <line x1="360" y1="460"  x2="540"  y2="640"  stroke-width="7" />
    <line x1="700" y1="520"  x2="900"  y2="720"  stroke-width="3" />

    <line x1="120" y1="920"  x2="260"  y2="1060" stroke-width="3" />
    <line x1="420" y1="900"  x2="560"  y2="1040" stroke-width="5" />
    <line x1="760" y1="880"  x2="880"  y2="1000" stroke-width="2" />

    <line x1="80"  y1="1320" x2="260"  y2="1500" stroke-width="5" />
    <line x1="380" y1="1280" x2="520"  y2="1420" stroke-width="3" />
    <line x1="520" y1="1380" x2="640"  y2="1500" stroke-width="4" />
    <line x1="700" y1="1340" x2="920"  y2="1560" stroke-width="6" />

    <line x1="260" y1="300"  x2="320" y2="360"  stroke-width="2" />
    <line x1="580" y1="720"  x2="640" y2="780"  stroke-width="4" />
    <line x1="280" y1="1160" x2="340" y2="1220" stroke-width="3" />
    <line x1="620" y1="1580" x2="700" y2="1660" stroke-width="2" />
    <!-- Líneas adicionales para rellenar ~15% más sin saturar -->
    <line x1="-40"  y1="260"  x2="120"  y2="420"  stroke-width="3" />
    <line x1="920"  y1="180"  x2="1120" y2="380"  stroke-width="4" />
    <line x1="160"  y1="760"  x2="340"  y2="940"  stroke-width="2" />
    <line x1="840"  y1="760"  x2="1020" y2="940"  stroke-width="3" />
    <line x1="200"  y1="1440" x2="380"  y2="1620" stroke-width="4" />
    <line x1="460"  y1="1480" x2="560"  y2="1580" stroke-width="3" />
    <line x1="840"  y1="1400" x2="1040" y2="1600" stroke-width="3" />
  </g>
</svg>

